<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devils Game Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ice: #EEF3F7; --board: #FFFFFF; --ink: #14202B; --muted: #5B6B7A;
    --rule: #D3DCE4; --blue: #1B4F9C; --red: #CE1126; --empty: #E4EAF0; --green: #2E7D4F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ice); color: var(--ink); font: 16px/1.5 "Barlow", system-ui, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 14px 40px; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .cond { font-family: "Barlow Condensed", sans-serif; font-weight: 700; }

  header { background: var(--board); border-bottom: 4px solid var(--red); }
  header .wrap { padding-top: 14px; padding-bottom: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .top h1 { font-family: "Barlow Condensed", sans-serif; font-size: 1.6rem; margin: 0; line-height: 1.1; }
  select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--board); max-width: 100%; }
  .score { font-size: clamp(2.4rem, 11vw, 4rem); line-height: 1; display: flex; align-items: baseline; gap: .3em; margin-top: 10px; flex-wrap: wrap; }
  .score .dash { color: var(--rule); }
  .status { color: var(--muted); }
  .live { color: var(--red); font-weight: 600; }
  .updated { font-size: .8rem; color: var(--muted); }

  .views { display: flex; gap: 4px; margin: 16px 0 14px; background: var(--empty); border-radius: 8px; padding: 4px; width: fit-content; max-width: 100%; overflow-x: auto; }
  .views button { border: 0; background: none; padding: 6px 16px; border-radius: 6px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  @media (max-width: 480px) { .views button { padding: 6px 10px; } }
  .views button[aria-selected="true"] { background: var(--board); color: var(--ink); box-shadow: 0 1px 2px rgba(20,32,43,.15); }

  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .grid.two { grid-template-columns: 1fr 1fr; } }
  section.panel { background: var(--board); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .stack > * + * { margin-top: 14px; }
  h2 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 1.35rem; margin: 0 0 8px; }
  h3 { font-size: .95rem; margin: 12px 0 6px; color: var(--muted); font-weight: 600; }
  .note { color: var(--muted); margin: 14px 0; }
  .error { color: var(--red); }
  .empty { color: var(--muted); font-size: .9rem; margin: 0; }

  .chip { display: inline-block; min-width: 3.2rem; text-align: center; border-radius: 999px; padding: 1px 10px; font-size: .85rem; font-weight: 600; }
  .chip.none { background: var(--empty); color: var(--muted); }
  .yes { background: var(--green); color: #fff; }
  .no { background: var(--empty); color: var(--muted); }

  .rows > div { display: grid; grid-template-columns: 7.2rem 4.4rem 1fr; gap: 8px; align-items: start; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .rows > div:last-child { border-bottom: 0; }
  .rows .lbl { font-weight: 600; }
  .when { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; white-space: nowrap; }
  .tm { color: var(--muted); font-size: .82em; font-weight: 600; }

  .ptabs { display: flex; gap: 2px; border-bottom: 2px solid var(--rule); margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
  .ptabs::-webkit-scrollbar { display: none; }
  .ptabs button { background: none; border: 0; padding: 6px 14px; font-family: "Barlow Condensed", sans-serif; font-size: 1.15rem; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .ptabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blue); }

  .seq { display: flex; flex-wrap: wrap; gap: 5px; }
  .seq button { border: 0; border-radius: 999px; padding: 2px 0; width: 2.4rem; font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .seq button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
  .detail { min-height: 1.5em; font-size: .9rem; margin-top: 6px; color: var(--muted); }
  .lastline { font-size: .9rem; margin-top: 6px; }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .92rem; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: .8rem; padding: 5px 7px; border-bottom: 2px solid var(--rule); white-space: nowrap; }
  td { padding: 5px 7px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td.num, th.num { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  .teamcell { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 500; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
  .seg { display: inline-flex; gap: 2px; background: var(--empty); border-radius: 6px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 3px 12px; border-radius: 4px; font-size: .88rem; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--board); color: var(--ink); box-shadow: 0 1px 2px rgba(20,32,43,.15); }
  th button.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; white-space: nowrap; }
  th[aria-sort="ascending"], th[aria-sort="descending"] { color: var(--ink); }
  table.box td:first-child, table.box th:first-child { position: sticky; left: 0; background: var(--board); z-index: 1; }
  .chip.sm { min-width: 0; padding: 0 7px; font-size: .75rem; }
  .rk { display: inline-block; min-width: 1.7em; color: var(--muted); font-size: .8em; }
  .sub { color: var(--muted); font-size: .85rem; margin: -4px 0 8px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Devils game sheet</h1>
      <select id="gamepick" aria-label="Choose a game"><option>Loading schedule…</option></select>
    </div>
    <div id="scoreboard"></div>
  </div>
</header>

<main class="wrap">
  <div class="views" role="tablist" aria-label="View">
    <button role="tab" data-view="live" aria-selected="true">Live tracker</button>
    <button role="tab" data-view="box" aria-selected="false">Box score</button>
    <button role="tab" data-view="matchup" aria-selected="false">Matchup</button>
    <button role="tab" data-view="misc" aria-selected="false">Misc</button>
  </div>
  <div id="view"><p class="note">Loading…</p></div>
</main>

<script>
/* =====================================================================
   SETTINGS: edit these
   ===================================================================== */
const TEAM = "NJD";              // three-letter code of the team to follow
const LIVE_REFRESH_MS = 20000;   // how often to refresh during a live game
const PREGAME_REFRESH_MS = 60000;// how often to check for puck drop on game day

// All-time franchise records. Career leaders (points, goals, assists, games
// played, goalie wins, shutouts) load live from records.nhl.com for both teams.
// Lines here fill in anything the live lookup doesn't cover (like single-season
// records) and stand in for everything if it fails. Add another team the same
// way (e.g. PIT: [["Goals, one season", "Lemieux 85 (88-89)"]]).
const RECORDS = {
  NJD: [
    ["Points", "Elias 1025"],
    ["Goals", "Elias 408"],
    ["Assists", "Elias 617"],
    ["Games played", "Daneyko 1283"],
    ["Goalie wins", "Brodeur 688"],
    ["Shutouts", "Brodeur 124"],
    ["Goals, one season", "Gionta 48 (05-06)"],
    ["Points, one season", "J. Hughes 99 (22-23)"],
  ],
};

// Chip colors. Devils are red; opponents use a color that contrasts with red.
const COLORS = {
  NJD: ["#CE1126", "#fff"], ANA: ["#B9975B", "#000"], BOS: ["#FFB81C", "#000"], BUF: ["#003087", "#fff"],
  CGY: ["#F1BE48", "#000"], CAR: ["#222222", "#fff"], CHI: ["#222222", "#fff"], COL: ["#236192", "#fff"],
  CBJ: ["#002654", "#fff"], DAL: ["#006847", "#fff"], DET: ["#8A8D8F", "#000"], EDM: ["#041E42", "#fff"],
  FLA: ["#041E42", "#fff"], LAK: ["#222222", "#fff"], MIN: ["#154734", "#fff"], MTL: ["#192168", "#fff"],
  NSH: ["#FFB81C", "#000"], NYI: ["#00539B", "#fff"], NYR: ["#0038A8", "#fff"], OTT: ["#C2912C", "#000"],
  PHI: ["#222222", "#fff"], PIT: ["#FCB514", "#000"], SJS: ["#006D75", "#fff"], SEA: ["#99D9D9", "#000"],
  STL: ["#002F87", "#fff"], TBL: ["#002868", "#fff"], TOR: ["#00205B", "#fff"], UTA: ["#71AFE5", "#000"],
  VAN: ["#00205B", "#fff"], VGK: ["#B4975A", "#000"], WSH: ["#041E42", "#fff"], WPG: ["#041E42", "#fff"],
};

/* =====================================================================
   DATA
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { games: [], game: null, pbp: null, matchup: null, view: "live", period: null, selected: null, timer: null, token: 0, updated: null,
  boxGame: null, boxPeriod: null, bios: null, sorts: {}, teamFilter: "both" };

const cache = new Map();
async function api(path, { fresh = false } = {}) {
  if (!fresh && cache.has(path)) return cache.get(path);
  const r = await fetch("/.netlify/functions/nhl?path=" + encodeURIComponent(path));
  if (!r.ok) throw new Error(`NHL API returned ${r.status} for ${path}`);
  const data = await r.json();
  cache.set(path, data);
  return data;
}

const isLive = (st) => st === "LIVE" || st === "CRIT";
const isFuture = (st) => st === "FUT" || st === "PRE";
const isDone = (st) => st === "FINAL" || st === "OFF";
const oppOf = (g) => (g.homeTeam.abbrev === TEAM ? g.awayTeam : g.homeTeam);
const usOf = (g) => (g.homeTeam.abbrev === TEAM ? g.homeTeam : g.awayTeam);
const atHome = (g) => g.homeTeam.abbrev === TEAM;
const shortDate = (iso) => new Date(iso).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
const timeOf = (iso) => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const localDay = (iso) => new Date(iso).toLocaleDateString("en-CA");

function resultText(g) {
  const us = usOf(g).score, them = oppOf(g).score;
  const extra = g.gameOutcome?.lastPeriodType && g.gameOutcome.lastPeriodType !== "REG" ? ` ${g.gameOutcome.lastPeriodType}` : "";
  return `${us > them ? "W" : "L"} ${us}-${them}${extra}`;
}

async function init() {
  try {
    const sched = await api(`v1/club-schedule-season/${TEAM}/now`);
    S.games = (sched.games || []).filter((g) => [1, 2, 3].includes(g.gameType)).sort((a, b) => a.startTimeUTC.localeCompare(b.startTimeUTC));
  } catch (e) {
    $("#view").innerHTML = `<p class="note error">${esc(e.message)}. The page needs its Netlify function, so run it on Netlify or with <code>netlify dev</code>.</p>`;
    return;
  }
  if (!S.games.length) { $("#view").innerHTML = `<p class="note">No games found on the schedule.</p>`; return; }

  $("#gamepick").innerHTML = S.games.map((g) => {
    const label = `${g.gameType === 1 ? "Pre: " : g.gameType === 3 ? "Playoffs: " : ""}${shortDate(g.startTimeUTC)}, ${atHome(g) ? "vs" : "at"} ${oppOf(g).abbrev}${isDone(g.gameState) ? `, ${resultText(g)}` : ""}`;
    return `<option value="${g.id}">${esc(label)}</option>`;
  }).join("");

  // Pick a default: a game in the URL, a live game, today's game, the next game, or the last one played
  const fromUrl = Number(new URLSearchParams(location.search).get("game"));
  const today = localDay(new Date().toISOString());
  const pick = S.games.find((g) => g.id === fromUrl)
    ?? S.games.find((g) => isLive(g.gameState))
    ?? S.games.find((g) => localDay(g.startTimeUTC) === today)
    ?? S.games.find((g) => isFuture(g.gameState))
    ?? S.games[S.games.length - 1];
  selectGame(pick.id);
}

async function selectGame(id) {
  clearTimeout(S.timer);
  const token = ++S.token;
  S.game = S.games.find((g) => g.id === id);
  S.pbp = null; S.matchup = null; S.period = null; S.selected = null; S.boxGame = null; S.boxPeriod = null; S.bios = null;
  S.view = isFuture(S.game.gameState) ? "matchup" : "live";
  $("#gamepick").value = id;
  history.replaceState(null, "", `?game=${id}`);
  render();
  refreshGame(token);
  loadMatchup(token);
}

async function refreshGame(token) {
  const g = S.game;
  try {
    const pbp = await api(`v1/gamecenter/${g.id}/play-by-play`, { fresh: true });
    if (token !== S.token) return;
    S.pbp = pbp; S.updated = new Date(); S.pbpError = null;
  } catch (e) {
    if (token !== S.token) return;
    S.pbpError = e.message;
  }
  render();
  const st = S.pbp?.gameState ?? g.gameState;
  const soon = isFuture(st) && new Date(g.startTimeUTC) - Date.now() < 3 * 3600e3;
  if (isLive(st)) S.timer = setTimeout(() => refreshGame(token), LIVE_REFRESH_MS);
  else if (soon) S.timer = setTimeout(() => refreshGame(token), PREGAME_REFRESH_MS);
}

// Season stats for a team; falls back to last season if this one hasn't started
async function clubStats(team, season) {
  for (const s of [season, season - 10001]) {
    try {
      const d = await api(`v1/club-stats/${team}/${s}/2`);
      if (d.skaters?.length) return { ...d, label: s === season ? "This season" : `${String(s).slice(0, 4)}-${String(s).slice(6)} (last season)` };
    } catch (e) { /* try the next season */ }
  }
  return null;
}

// Career franchise leaders from records.nhl.com, as [label, "Name value"] pairs
const RECORD_STATS = [["Points", "skaters", "points"], ["Goals", "skaters", "goals"], ["Assists", "skaters", "assists"],
  ["Games played", "skaters", "gamesPlayed"], ["Goalie wins", "goalies", "wins"], ["Shutouts", "goalies", "shutouts"],
  ["Goals, one season", "season", "goals"], ["Points, one season", "season", "points"]];
const seasonShort = (id) => `${String(id).slice(2, 4)}-${String(id).slice(6)}`; // 20052006 -> "05-06"
async function franchiseRecords(team) {
  const franchise = (await api("records/franchise")).data?.find((f) => f.teamAbbrev === team && f.lastSeasonId == null);
  if (!franchise) return null;
  const lines = await Promise.all(RECORD_STATS.map(async ([label, kind, stat]) => {
    try {
      const p = (await api(`records/${kind}/${franchise.id}/${stat}`)).data?.[0];
      if (!p || p[stat] == null) return null;
      return [label, `${p.lastName} ${p[stat]}${kind === "season" && p.seasonId ? ` (${seasonShort(p.seasonId)})` : ""}`];
    } catch (e) { return null; }
  }));
  return lines.filter(Boolean);
}

async function loadMatchup(token) {
  const g = S.game, opp = oppOf(g).abbrev;
  const done = S.games.filter((x) => isDone(x.gameState) && x.startTimeUTC < g.startTimeUTC);
  const lastGame = done[done.length - 1];
  const meetings = done.filter((x) => oppOf(x).abbrev === opp && x.gameType === g.gameType).reverse();
  const nextMeeting = S.games.find((x) => x.startTimeUTC > g.startTimeUTC && oppOf(x).abbrev === opp);
  const nextGame = S.games.find((x) => x.startTimeUTC > g.startTimeUTC);

  const [standings, usStats, oppStats, lastBox, meetBox, usRecords, oppRecords] = await Promise.allSettled([
    api("v1/standings/now"),
    clubStats(TEAM, g.season),
    clubStats(opp, g.season),
    lastGame ? api(`v1/gamecenter/${lastGame.id}/boxscore`) : null,
    meetings[0] ? api(`v1/gamecenter/${meetings[0].id}/boxscore`) : null,
    franchiseRecords(TEAM),
    franchiseRecords(opp),
  ]);
  if (token !== S.token) return;
  const val = (p) => (p.status === "fulfilled" ? p.value : null);
  S.matchup = { opp, standings: val(standings), usStats: val(usStats), oppStats: val(oppStats), lastGame, lastBox: val(lastBox), meetings, meetBox: val(meetBox), nextMeeting, nextGame,
    records: { [TEAM]: val(usRecords), [opp]: val(oppRecords) } };
  render();
}

// Run fn over items with at most n requests in flight
async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const j = i++; out[j] = await fn(items[j]); } }));
  return out;
}

// Player bios for the Misc tab: this game's lineup if posted, else both current rosters
async function loadBios(token) {
  const g = S.game;
  S.bios = { for: g.id, list: null, error: null, source: null };
  try {
    const abbrevById = new Map([[g.awayTeam.id, g.awayTeam.abbrev], [g.homeTeam.id, g.homeTeam.abbrev]]);
    const spots = S.pbp?.rosterSpots ?? [];
    let list;
    if (spots.length) {
      list = spots.map((p) => ({ id: p.playerId, team: abbrevById.get(p.teamId), num: p.sweaterNumber, pos: p.positionCode }));
      S.bios.source = "lineup";
    } else {
      const rosters = await Promise.all([g.awayTeam.abbrev, g.homeTeam.abbrev].map((t) => api(`v1/roster/${t}/current`)
        .then((r) => ["forwards", "defensemen", "goalies"].flatMap((k) => r[k] ?? []).map((p) => ({ id: p.id, team: t, num: p.sweaterNumber, pos: p.positionCode })))
        .catch(() => [])));
      list = rosters.flat();
      S.bios.source = "roster";
    }
    const out = await pool(list, 8, async (p) => {
      try { return { ...p, bio: await api(`v1/player/${p.id}/landing`) }; } catch (e) { return { ...p, bio: null }; }
    });
    if (token !== S.token) return;
    S.bios.list = out;
  } catch (e) {
    if (token !== S.token) return;
    S.bios.error = e.message;
  }
  render();
}

/* =====================================================================
   HELPERS FOR PLAY-BY-PLAY
   ===================================================================== */
let players = new Map(), teams = new Map();
function teamInfo(t) {
  const [bg, fg] = COLORS[t.abbrev] ?? ["#5B6B7A", "#fff"];
  return { id: t.id, abbrev: t.abbrev, name: t.commonName?.default ?? t.abbrev, bg, fg };
}
function buildLookups() {
  const d = S.pbp;
  teams = new Map([d.awayTeam, d.homeTeam].map((t) => [t.id, teamInfo(t)]));
  players = new Map((d.rosterSpots || []).map((p) => [p.playerId, { name: `${p.firstName?.default ?? ""} ${p.lastName?.default ?? ""}`.trim(), teamId: p.teamId, num: p.sweaterNumber }]));
}
const words = (s) => String(s ?? "").replace(/-/g, " ");
const periodLabel = (pd) => (pd.periodType === "SO" ? "SO" : pd.number <= 3 ? `P${pd.number}` : pd.number === 4 ? "OT" : `OT${pd.number - 3}`);
const when = (p) => `${periodLabel(p.periodDescriptor)} ${p.timeInPeriod}`;
const teamOf = (pid) => players.get(pid)?.teamId;
const pname = (pid) => players.get(pid)?.name ?? "Unknown";
const who = (pid) => (pid ? `${esc(pname(pid))} <span class="tm">#${players.get(pid)?.num ?? ""}</span>` : `<span class="tm">Unknown</span>`);
const chip = (tid, label) => { const t = teams.get(tid); return t ? `<span class="chip" style="background:${t.bg};color:${t.fg}">${label ?? t.name}</span>` : `<span class="chip none">—</span>`; };
const shooterOf = (p) => p.details?.shootingPlayerId ?? p.details?.scoringPlayerId;
const isShot = (p) => p.typeDescKey === "shot-on-goal" || p.typeDescKey === "goal";
// All plays in order, minus the shootout (excluded from every stat)
const gamePlays = () => [...(S.pbp.plays || [])].sort((a, b) => a.sortOrder - b.sortOrder).filter((p) => p.periodDescriptor?.periodType !== "SO");

// Which team gets credit for an event
function creditTeam(p) {
  const d = p.details || {};
  switch (p.typeDescKey) {
    case "faceoff": return teamOf(d.winningPlayerId) ?? d.eventOwnerTeamId;
    case "hit": return teamOf(d.hittingPlayerId) ?? d.eventOwnerTeamId;
    case "penalty": return teamOf(d.committedByPlayerId ?? d.servedByPlayerId) ?? d.eventOwnerTeamId;
    case "blocked-shot": return teamOf(d.blockingPlayerId) ?? d.eventOwnerTeamId;
    case "takeaway": case "giveaway": return teamOf(d.playerId) ?? d.eventOwnerTeamId;
    default: return teamOf(shooterOf(p)) ?? d.eventOwnerTeamId;
  }
}
function describe(p) {
  const d = p.details || {};
  switch (p.typeDescKey) {
    case "goal": { const a = [d.assist1PlayerId, d.assist2PlayerId].filter(Boolean).map(pname); return `${who(d.scoringPlayerId)}${a.length ? `, from ${esc(a.join(" and "))}` : ", unassisted"}`; }
    case "penalty": { const pid = d.committedByPlayerId ?? d.servedByPlayerId; return `${pid ? who(pid) : "Bench"}, ${esc(words(d.descKey))} (${d.duration ?? "?"} min)`; }
    case "faceoff": return `${who(d.winningPlayerId)} beat ${esc(pname(d.losingPlayerId))}`;
    case "hit": return `${who(d.hittingPlayerId)} on ${esc(pname(d.hitteePlayerId))}`;
    default: return `${who(shooterOf(p))}${d.shotType ? `, ${esc(words(d.shotType))}` : ""}`;
  }
}

/* =====================================================================
   RENDERING
   ===================================================================== */
function render() {
  renderScoreboard();
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-selected", b.dataset.view === S.view));
  if (S.view === "misc" && S.game && S.bios?.for !== S.game.id && (S.pbp || S.pbpError)) loadBios(S.token);
  // Keep sideways-scrolled tables where they were across live refreshes
  const scrolled = [...document.querySelectorAll(".scroll[id]")].map((el) => [el.id, el.scrollLeft]);
  $("#view").innerHTML = { live: renderLive, box: renderBox, matchup: renderMatchup, misc: renderMisc }[S.view]();
  scrolled.forEach(([id, x]) => { const el = document.getElementById(id); if (el) el.scrollLeft = x; });
}

function renderScoreboard() {
  const g = S.game; if (!g) return;
  const d = S.pbp, st = d?.gameState ?? g.gameState;
  const home = d?.homeTeam ?? g.homeTeam, away = d?.awayTeam ?? g.awayTeam;
  const us = atHome(g) ? home : away, them = atHome(g) ? away : home;
  let status;
  if (isFuture(st)) status = `Puck drop ${shortDate(g.startTimeUTC)}, ${timeOf(g.startTimeUTC)}`;
  else if (isLive(st)) {
    const pd = d?.periodDescriptor ?? d?.plays?.at(-1)?.periodDescriptor;
    status = `<span class="live">Live</span>, ${pd ? periodLabel(pd) : ""} ${d?.clock?.inIntermission ? "intermission" : d?.clock?.timeRemaining ?? ""}`;
  } else {
    const lastType = d?.plays?.at(-1)?.periodDescriptor?.periodType ?? g.gameOutcome?.lastPeriodType;
    status = `Final${lastType && lastType !== "REG" ? ` (${lastType})` : ""}`;
  }
  const scoreLine = isFuture(st)
    ? `<span>${esc(us.abbrev)}</span><span class="dash">${atHome(g) ? "vs" : "at"}</span><span>${esc(them.abbrev)}</span>`
    : `<span>${esc(us.abbrev)} ${us.score ?? 0}</span><span class="dash">–</span><span>${them.score ?? 0} ${esc(them.abbrev)}</span>`;
  $("#scoreboard").innerHTML = `<div class="score cond">${scoreLine}</div>
    <div class="status">${status}</div>
    ${isLive(st) && S.updated ? `<div class="updated">Updated ${S.updated.toLocaleTimeString()}, refreshing every ${LIVE_REFRESH_MS / 1000} seconds</div>` : ""}`;
}

function renderLive() {
  if (S.pbpError && !S.pbp) return `<p class="note error">${esc(S.pbpError)}</p>`;
  if (!S.pbp) return `<p class="note">Loading play-by-play…</p>`;
  buildLookups();
  const plays = gamePlays();
  if (!plays.length) return `<p class="note">No plays yet. This fills in automatically once the puck drops. Check the Matchup tab for the pregame numbers.</p>`;

  const us = [...teams.values()].find((t) => t.abbrev === TEAM), them = [...teams.values()].find((t) => t.abbrev !== TEAM);
  const periods = [...new Set(plays.map((p) => p.periodDescriptor.number))];
  const livePeriod = plays.at(-1).periodDescriptor.number;
  const period = S.period ?? (isLive(S.pbp.gameState) ? livePeriod : "all");
  const sel = period === "all" ? plays : plays.filter((p) => p.periodDescriptor.number === period);
  const pdOf = (n) => plays.find((p) => p.periodDescriptor.number === n).periodDescriptor;

  // Firsts (whole game)
  const firsts = [["First faceoff", (x) => x.typeDescKey === "faceoff"], ["First hit", (x) => x.typeDescKey === "hit"], ["First shot", isShot], ["First goal", (x) => x.typeDescKey === "goal"], ["First penalty", (x) => x.typeDescKey === "penalty"]].map(([label, test]) => {
    const p = plays.find(test);
    return `<div><span class="lbl">${label}</span>${p ? chip(creditTeam(p)) : chip(null)}<span>${p ? `<span class="when">${when(p)}</span>${describe(p)}` : `<span class="tm">Not yet</span>`}</span></div>`;
  }).join("");

  // Whistle in the first minute of each period (a stoppage, goal, or penalty before 1:00)
  const whistles = periods.filter((n) => n <= 3 || pdOf(n).periodType === "OT").map((n) => {
    const p = plays.find((x) => x.periodDescriptor.number === n && ["stoppage", "goal", "penalty"].includes(x.typeDescKey) && x.timeInPeriod < "01:00");
    const pastMinute = plays.some((x) => x.periodDescriptor.number > n || (x.periodDescriptor.number === n && x.timeInPeriod >= "01:00"));
    const val = p ? `<span class="chip yes">Yes</span>` : pastMinute ? `<span class="chip no">No</span>` : `<span class="chip none">…</span>`;
    const why = p ? `<span class="when">${p.timeInPeriod}</span>${esc(p.typeDescKey === "stoppage" ? words(p.details?.reason) : words(p.typeDescKey))}` : "";
    return `<div><span class="lbl">${periodLabel(pdOf(n))}</span>${val}<span>${why}</span></div>`;
  }).join("");

  // Sequences
  const seq = (list, kind) => list.length ? `<div class="seq">${list.map((p, i) => {
    const t = teams.get(creditTeam(p)) ?? { bg: "#5B6B7A", fg: "#fff", name: "Unknown" }, key = `${kind}-${p.sortOrder}`;
    return `<button data-sel="${key}" aria-pressed="${S.selected === key}" style="background:${t.bg};color:${t.fg}" aria-label="${kind} ${i + 1}, ${esc(t.name)}">${i + 1}</button>`;
  }).join("")}</div>` : `<p class="empty">None yet.</p>`;
  const shots = sel.filter(isShot), faceoffs = sel.filter((p) => p.typeDescKey === "faceoff");
  const selPlay = S.selected && plays.find((p) => S.selected.endsWith("-" + p.sortOrder));
  const detail = selPlay ? `<span class="when">${when(selPlay)}</span>${describe(selPlay)}${selPlay.typeDescKey === "goal" ? " <b>(goal)</b>" : ""}` : "Tap a number for the play.";
  const lastOf = (list) => (list.length ? `${chip(creditTeam(list.at(-1)))} <span class="when">${list.at(-1).timeInPeriod}</span>` : chip(null));

  // Totals
  const count = (fn, t) => sel.filter((p) => fn(p) && creditTeam(p) === t?.id).length;
  const totals = [
    ["Goals", (p) => p.typeDescKey === "goal"], ["Shots", isShot], ["Takeaways", (p) => p.typeDescKey === "takeaway"],
    ["Faceoffs won", (p) => p.typeDescKey === "faceoff"], ["Hits", (p) => p.typeDescKey === "hit"], ["Blocked shots", (p) => p.typeDescKey === "blocked-shot" && p.details?.reason !== "teammate-blocked"],
  ].map(([l, f]) => `<tr><td>${l}</td><td class="num">${count(f, us)}</td><td class="num">${count(f, them)}</td></tr>`).join("");

  // Goals & penalties (whole game)
  const list = (type) => {
    const rows = plays.filter((p) => p.typeDescKey === type);
    if (!rows.length) return `<p class="empty">None yet.</p>`;
    return `<div class="scroll"><table><thead><tr><th>#</th><th>Team</th><th>Player</th><th class="num">No.</th><th>Time</th>${type === "penalty" ? "<th>Infraction</th>" : "<th>Assists</th>"}</tr></thead><tbody>${rows.map((p, i) => {
      const d = p.details || {}, pid = type === "goal" ? d.scoringPlayerId : d.committedByPlayerId ?? d.servedByPlayerId, t = teams.get(creditTeam(p));
      const last = type === "penalty" ? `${esc(words(d.descKey))} (${d.duration ?? "?"})` : esc([d.assist1PlayerId, d.assist2PlayerId].filter(Boolean).map(pname).join(", ") || "Unassisted");
      return `<tr><td>${i + 1}</td><td>${chip(t?.id, t?.abbrev)}</td><td>${pid ? esc(pname(pid)) : "Bench"}</td><td class="num">${players.get(pid)?.num ?? ""}</td><td class="when">${when(p)}</td><td>${last}</td></tr>`;
    }).join("")}</tbody></table></div>`;
  };

  const tabs = [...periods.map((n) => [n, periodLabel(pdOf(n))]), ["all", "Game"]];
  return `<div class="stack">
    <div class="grid two">
      <section class="panel"><h2>Firsts</h2><div class="rows">${firsts}</div></section>
      <section class="panel"><h2>Whistle in the first minute</h2><div class="rows">${whistles}</div></section>
    </div>
    <section class="panel">
      <div class="ptabs" role="tablist" aria-label="Period">${tabs.map(([v, l]) => `<button role="tab" data-period="${v}" aria-selected="${v === period}">${l}</button>`).join("")}</div>
      <div class="grid two">
        <div>
          <h3>Shots on goal (${shots.length})</h3>${seq(shots, "Shot")}
          <div class="lastline">Last shot ${lastOf(shots)}</div>
          <h3>Faceoffs (${faceoffs.length})</h3>${seq(faceoffs, "Faceoff")}
          <div class="lastline">Last faceoff ${lastOf(faceoffs)}</div>
          <div class="detail" aria-live="polite">${detail}</div>
        </div>
        <div>
          <h3>${period === "all" ? "Game" : periodLabel(pdOf(period))} totals</h3>
          <table><thead><tr><th></th><th class="num">${esc(us?.abbrev)}</th><th class="num">${esc(them?.abbrev)}</th></tr></thead><tbody>${totals}</tbody></table>
        </div>
      </div>
    </section>
    <div class="grid two">
      <section class="panel"><h2>Goals</h2>${list("goal")}</section>
      <section class="panel"><h2>Penalties</h2>${list("penalty")}</section>
    </div>
  </div>`;
}

/* ---------- Matchup view ---------- */
const lastName = (p) => p.lastName?.default ?? p.name?.default ?? "";
const mmss = (sec) => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}`;
const secs = (t) => { const [m, s] = String(t ?? "0:0").split(":").map(Number); return m * 60 + (s || 0); };
const pct3 = (v) => (v == null ? "" : Number(v).toFixed(3).replace(/^0/, ""));

function leaders(stats) {
  const sk = stats?.skaters ?? [];
  if (!sk.length) return null;
  const maxGp = Math.max(...sk.map((p) => p.gamesPlayed ?? 0));
  const top = (key, fmt = (v) => v) => { const p = [...sk].sort((a, b) => (b[key] ?? -1e9) - (a[key] ?? -1e9))[0]; return p && p[key] != null ? `${lastName(p)} ${fmt(p[key])}` : "—"; };
  const regulars = sk.filter((p) => (p.gamesPlayed ?? 0) >= maxGp / 2);
  const toi = [...regulars].sort((a, b) => (b.avgTimeOnIcePerGame ?? 0) - (a.avgTimeOnIcePerGame ?? 0))[0];
  return {
    Points: top("points"), Goals: top("goals"), Assists: top("assists"), Shots: top("shots"),
    "Avg ice time": toi?.avgTimeOnIcePerGame != null ? `${lastName(toi)} ${mmss(toi.avgTimeOnIcePerGame)}` : "—",
    "Plus/minus": top("plusMinus", (v) => (v > 0 ? `+${v}` : v)), "Penalty min": top("penaltyMinutes"),
    "PP goals": top("powerPlayGoals"), "SH goals": top("shorthandedGoals"),
  };
}

function boxSummary(box, abbrev) {
  if (!box) return null;
  const side = box.homeTeam?.abbrev === abbrev ? "homeTeam" : "awayTeam", oside = side === "homeTeam" ? "awayTeam" : "homeTeam";
  const st = box.playerByGameStats?.[side] ?? {};
  const skaters = [...(st.forwards ?? []), ...(st.defense ?? [])], goalies = st.goalies ?? [];
  const nm = (p) => p.name?.default ?? "";
  const scorers = skaters.filter((p) => p.goals > 0).sort((a, b) => b.goals - a.goals).map((p) => `${nm(p)}${p.goals > 1 ? ` ×${p.goals}` : ""}`).join(", ");
  const assists = skaters.filter((p) => p.assists > 0).sort((a, b) => b.assists - a.assists).map((p) => `${nm(p)}${p.assists > 1 ? ` ×${p.assists}` : ""}`).join(", ");
  const pts = (p) => p.points ?? (p.goals ?? 0) + (p.assists ?? 0);
  const points = skaters.filter((p) => pts(p) > 0).sort((a, b) => pts(b) - pts(a)).map((p) => `${nm(p)} ${pts(p)}`).join(", ");
  const shotLead = [...skaters].sort((a, b) => (b.sog ?? 0) - (a.sog ?? 0))[0];
  const toiLead = [...skaters].sort((a, b) => secs(b.toi) - secs(a.toi))[0];
  const saves = goalies.reduce((s, g) => s + (g.saves ?? (Number(String(g.saveShotsAgainst ?? "0/0").split("/")[0]) || 0)), 0);
  const teamShots = box[side]?.sog ?? skaters.reduce((s, p) => s + (p.sog ?? 0), 0);
  return { scorers: scorers || "None", assists: assists || "None", points: points || "None", shotLead: shotLead ? `${nm(shotLead)}, ${shotLead.sog ?? 0}` : "—", toiLead: toiLead ? `${nm(toiLead)}, ${toiLead.toi}` : "—", saves, teamShots, opp: box[oside]?.abbrev };
}

function renderMatchup() {
  const M = S.matchup, g = S.game;
  if (!M) return `<p class="note">Loading matchup…</p>`;
  const opp = M.opp;
  const [ubg] = COLORS[TEAM] ?? ["#CE1126"], [obg] = COLORS[opp] ?? ["#5B6B7A"];

  // Standings
  const rows = (M.standings?.standings ?? []).filter((s) => [TEAM, opp].includes(s.teamAbbrev?.default));
  const standings = rows.length ? `<div class="scroll"><table>
    <thead><tr><th>Team</th><th class="num">Div</th><th class="num">Conf</th><th class="num">GP</th><th class="num">W</th><th class="num">L</th><th class="num">OT</th><th class="num">PTS</th><th class="num">P%</th><th class="num">RW</th><th class="num">ROW</th><th class="num">GF</th><th class="num">GA</th><th class="num">DIFF</th><th>Home</th><th>Away</th><th>S/O</th><th>L10</th><th>Strk</th></tr></thead>
    <tbody>${rows.map((s) => { const diff = s.goalDifferential ?? (s.goalFor - s.goalAgainst); const c = s.teamAbbrev.default === TEAM ? ubg : obg; return `<tr>
      <td><span class="teamcell"><span class="swatch" style="background:${c}"></span>${esc(s.teamCommonName?.default ?? s.teamAbbrev.default)}</span></td>
      <td class="num">${s.divisionSequence ?? ""}</td><td class="num">${s.conferenceSequence ?? ""}</td>
      <td class="num">${s.gamesPlayed}</td><td class="num">${s.wins}</td><td class="num">${s.losses}</td><td class="num">${s.otLosses}</td><td class="num"><b>${s.points}</b></td><td class="num">${pct3(s.pointPctg)}</td>
      <td class="num">${s.regulationWins ?? ""}</td><td class="num">${s.regulationPlusOtWins ?? ""}</td><td class="num">${s.goalFor}</td><td class="num">${s.goalAgainst}</td><td class="num ${diff >= 0 ? "pos" : "neg"}">${diff > 0 ? "+" : ""}${diff}</td>
      <td>${s.homeWins}-${s.homeLosses}-${s.homeOtLosses}</td><td>${s.roadWins}-${s.roadLosses}-${s.roadOtLosses}</td><td>${s.shootoutWins ?? 0}-${s.shootoutLosses ?? 0}</td>
      <td>${s.l10Wins}-${s.l10Losses}-${s.l10OtLosses}</td><td>${s.streakCode ?? ""}${s.streakCount ?? ""}</td></tr>`; }).join("")}</tbody></table></div>`
    : `<p class="empty">Standings aren't available right now.</p>`;

  // Season series
  const mb = boxSummary(M.meetBox, TEAM);
  const series = `<dl class="kv">
    ${M.meetings.length ? M.meetings.map((m, i) => `<dt>${shortDate(m.startTimeUTC)}</dt><dd>${resultText(m)}${i === 0 && mb ? `, Devils goals: ${esc(mb.scorers)}` : ""}</dd>`).join("") : `<dt>This season</dt><dd>First meeting</dd>`}
    <dt>Next meeting</dt><dd>${M.nextMeeting ? `${shortDate(M.nextMeeting.startTimeUTC)}, ${atHome(M.nextMeeting) ? "Home" : "Away"}` : "None scheduled"}</dd>
    <dt>Devils next</dt><dd>${M.nextGame ? `${shortDate(M.nextGame.startTimeUTC)}, ${atHome(M.nextGame) ? "vs" : "at"} ${esc(oppOf(M.nextGame).abbrev)}` : "—"}</dd></dl>`;

  // Last game
  const lb = boxSummary(M.lastBox, TEAM);
  const last = M.lastGame && lb ? `<dl class="kv">
    <dt>Result</dt><dd>${resultText(M.lastGame)} ${atHome(M.lastGame) ? "vs" : "at"} ${esc(oppOf(M.lastGame).abbrev)}, ${shortDate(M.lastGame.startTimeUTC)}</dd>
    <dt>Goals</dt><dd>${esc(lb.scorers)}</dd><dt>Assists</dt><dd>${esc(lb.assists)}</dd><dt>Points</dt><dd>${esc(lb.points)}</dd>
    <dt>Most shots</dt><dd>${esc(lb.shotLead)}</dd><dt>Most ice time</dt><dd>${esc(lb.toiLead)}</dd>
    <dt>Saves</dt><dd>${lb.saves}</dd><dt>Team shots</dt><dd>${lb.teamShots}</dd></dl>`
    : `<p class="empty">${M.lastGame ? "Couldn't load the last game's boxscore." : "No earlier games this season."}</p>`;

  // Leaders
  const lu = leaders(M.usStats), lo = leaders(M.oppStats);
  const cats = ["Points", "Goals", "Assists", "Shots", "Avg ice time", "Plus/minus", "Penalty min", "PP goals", "SH goals"];
  const leaderTable = lu || lo ? `<div class="scroll"><table>
    <thead><tr><th></th><th>${TEAM}</th><th>${esc(opp)}</th></tr></thead>
    <tbody>${cats.map((c) => `<tr><td><b>${c}</b></td><td>${esc(lu?.[c] ?? "—")}</td><td>${esc(lo?.[c] ?? "—")}</td></tr>`).join("")}</tbody></table></div>
    <p class="empty" style="margin-top:8px">Regular season. ${TEAM}: ${esc(M.usStats?.label ?? "n/a")}. ${esc(opp)}: ${esc(M.oppStats?.label ?? "n/a")}.</p>`
    : `<p class="empty">Season stats aren't available yet.</p>`;

  // Records
  // Live career leaders first, then hand-kept lines for anything they don't cover
  const recordsFor = (t) => {
    const live = M.records?.[t] ?? [];
    return [...live, ...(RECORDS[t] ?? []).filter(([k]) => !live.some(([lk]) => lk === k))];
  };
  const records = [TEAM, opp].map((t) => [t, recordsFor(t)]).filter(([, r]) => r.length)
    .map(([t, r]) => `<h3>${esc(t)}</h3><dl class="kv">${r.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`).join("");

  // Goalies
  const goalieTable = (stats, team) => {
    const gl = [...(stats?.goalies ?? [])].sort((a, b) => (b.gamesPlayed ?? 0) - (a.gamesPlayed ?? 0)).slice(0, 3);
    if (!gl.length) return `<h3>${esc(team)}</h3><p class="empty">No goalie stats yet.</p>`;
    return `<h3>${esc(team)}</h3><div class="scroll"><table><thead><tr><th>Name</th><th class="num">GP</th><th class="num">W</th><th class="num">L</th><th class="num">OTL</th><th class="num">SO</th><th class="num">GAA</th><th class="num">SV%</th></tr></thead><tbody>${
      gl.map((x) => `<tr><td>${esc(`${x.firstName?.default?.[0] ?? ""}. ${lastName(x)}`)}</td><td class="num">${x.gamesPlayed ?? ""}</td><td class="num">${x.wins ?? ""}</td><td class="num">${x.losses ?? ""}</td><td class="num">${x.overtimeLosses ?? ""}</td><td class="num">${x.shutouts ?? ""}</td><td class="num">${x.goalsAgainstAverage != null ? Number(x.goalsAgainstAverage).toFixed(2) : ""}</td><td class="num">${pct3(x.savePercentage)}</td></tr>`).join("")}</tbody></table></div>`;
  };

  return `<div class="stack">
    <section class="panel"><h2>Standings</h2>${standings}</section>
    <div class="grid two">
      <section class="panel"><h2>Season series vs ${esc(opp)}</h2>${series}</section>
      <section class="panel"><h2>Devils last game</h2>${last}</section>
    </div>
    <div class="grid two">
      <section class="panel"><h2>Stat leaders</h2>${leaderTable}</section>
      <section class="panel"><h2>Franchise records</h2>${records || `<p class="empty">Add records in the settings at the top of the code.</p>`}</section>
    </div>
    <section class="panel"><h2>Goaltender comparison</h2><div class="grid two"><div>${goalieTable(M.usStats, TEAM)}</div><div>${goalieTable(M.oppStats, opp)}</div></div></section>
  </div>`;
}

/* ---------- Sortable tables (Box score and Misc) ---------- */
// cols: [{ k, label, val(row) for sorting, fmt(row) -> HTML (optional), num, title }]. The first column is the player.
function sortedTable(id, cols, rows, def) {
  const s = (S.sorts[id] ??= def);
  const col = cols.find((c) => c.k === s.k) ?? cols[0];
  const blank = (v) => v == null || v === "" || Number.isNaN(v);
  const sorted = [...rows].sort((a, b) => {
    const x = col.val(a), y = col.val(b);
    if (blank(x) || blank(y)) return blank(x) - blank(y); // blanks always last
    const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y));
    return s.dir === "asc" ? c : -c;
  });
  if (!sorted.length) return `<p class="empty">No players.</p>`;
  const head = cols.map((c) => {
    const on = c.k === col.k, dir = on ? (s.dir === "asc" ? "ascending" : "descending") : "none";
    return `<th class="${c.num ? "num" : ""}" aria-sort="${dir}"><button class="sort" data-sort="${id}:${c.k}" data-dir="${c.num ? "desc" : "asc"}"${c.title ? ` title="${c.title}"` : ""}>${c.label}${on ? (s.dir === "asc" ? " ▲" : " ▼") : ""}</button></th>`;
  }).join("");
  const body = sorted.map((r, i) => `<tr>${cols.map((c, j) => {
    const v = c.fmt ? c.fmt(r) : esc(c.val(r) ?? "");
    return `<td class="${c.num ? "num" : ""}">${j === 0 ? `<span class="rk">${i + 1}</span>` : ""}${v}</td>`;
  }).join("")}</tr>`).join("");
  return `<div class="scroll" id="tbl-${id}"><table class="box"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

const teamChip = (abbrev) => { const [bg, fg] = COLORS[abbrev] ?? ["#5B6B7A", "#fff"]; return `<span class="chip sm" style="background:${bg};color:${fg}">${esc(abbrev ?? "—")}</span>`; };
const teamOk = (abbrev) => S.teamFilter === "both" || (S.teamFilter === "us") === (abbrev === TEAM);
const teamSeg = (opp) => `<div class="seg" role="group" aria-label="Team">${[["both", "Both"], ["us", TEAM], ["them", opp]].map(([v, l]) => `<button data-team="${v}" aria-pressed="${S.teamFilter === v}">${esc(l)}</button>`).join("")}</div>`;
const plusMinus = (v) => (v == null ? "" : v > 0 ? `+${v}` : `${v}`);
const pctCell = (v) => (v == null ? "—" : `${Math.round(v * 100)}%`);
const playerCell = (r) => `${esc(r.name)} <span class="tm">#${r.num ?? ""}</span>`;
const nameCol = { k: "name", label: "Player", val: (r) => r.name, fmt: playerCell };
const teamCol = { k: "team", label: "Team", val: (r) => r.team, fmt: (r) => teamChip(r.team) };
const posCol = { k: "pos", label: "Pos", val: (r) => r.pos };
const numCol = (k, label, title) => ({ k, label, title, num: true, val: (r) => r[k] });

/* ---------- Box score view ---------- */
function renderBox() {
  const started = !!S.pbp && gamePlays().length > 0;
  const which = S.boxGame ?? (started || !S.matchup?.lastGame ? "this" : "last");
  const lg = S.matchup?.lastGame;
  const seg = `<div class="seg" role="group" aria-label="Game"><button data-boxgame="this" aria-pressed="${which === "this"}">This game</button><button data-boxgame="last" aria-pressed="${which === "last"}">Last game</button></div>`;
  const opp = which === "last" && lg ? oppOf(lg).abbrev : oppOf(S.game).abbrev;
  return `<div class="stack"><div class="toolbar">${seg}${teamSeg(opp)}</div>${which === "this" ? liveBox() : lastBox()}</div>`;
}

// Per-player counts from play-by-play
function tallyPlays(plays) {
  const st = new Map();
  const bump = (pid, k, n = 1) => { if (!pid) return; if (!st.has(pid)) st.set(pid, {}); const o = st.get(pid); o[k] = (o[k] ?? 0) + n; };
  for (const p of plays) {
    const d = p.details || {};
    switch (p.typeDescKey) {
      case "goal": bump(d.scoringPlayerId, "g"); bump(d.scoringPlayerId, "sog"); bump(d.assist1PlayerId, "a"); bump(d.assist2PlayerId, "a"); bump(d.goalieInNetId, "sa"); bump(d.goalieInNetId, "ga"); break;
      case "shot-on-goal": bump(d.shootingPlayerId, "sog"); bump(d.goalieInNetId, "sa"); break;
      case "missed-shot": bump(d.shootingPlayerId, "miss"); break;
      case "hit": bump(d.hittingPlayerId, "hits"); break;
      case "blocked-shot": if (d.reason !== "teammate-blocked") bump(d.blockingPlayerId, "blk"); break; // the NHL doesn't count blocking your own teammate
      case "penalty": bump(d.committedByPlayerId, "pim", d.duration ?? 0); break;
      case "faceoff": bump(d.winningPlayerId, "fow"); bump(d.losingPlayerId, "fol"); break;
      case "takeaway": bump(d.playerId, "tk"); break;
      case "giveaway": bump(d.playerId, "gv"); break;
    }
  }
  return st;
}

function liveBox() {
  if (S.pbpError && !S.pbp) return `<p class="note error">${esc(S.pbpError)}</p>`;
  if (!S.pbp) return `<p class="note">Loading play-by-play…</p>`;
  buildLookups();
  const plays = gamePlays();
  if (!plays.length) return `<section class="panel"><p class="empty">This game's box score fills in once the puck drops. Tap Last game for the Devils' previous game.</p></section>`;

  const periods = [...new Set(plays.map((p) => p.periodDescriptor.number))];
  const pdOf = (n) => plays.find((p) => p.periodDescriptor.number === n).periodDescriptor;
  const period = periods.includes(S.boxPeriod) ? S.boxPeriod : "all";
  const st = tallyPlays(period === "all" ? plays : plays.filter((p) => p.periodDescriptor.number === period));
  const z = (o, k) => o?.[k] ?? 0;
  const rows = (S.pbp.rosterSpots ?? []).map((p) => {
    const o = st.get(p.playerId), fo = z(o, "fow") + z(o, "fol"), sa = z(o, "sa");
    return {
      name: `${p.firstName?.default ?? ""} ${p.lastName?.default ?? ""}`.trim(), num: p.sweaterNumber, pos: p.positionCode,
      team: teams.get(p.teamId)?.abbrev, g: z(o, "g"), a: z(o, "a"), p: z(o, "g") + z(o, "a"), sog: z(o, "sog"),
      att: z(o, "sog") + z(o, "miss"), hits: z(o, "hits"), blk: z(o, "blk"), pim: z(o, "pim"), fow: z(o, "fow"), fol: z(o, "fol"),
      fo: fo ? z(o, "fow") / fo : null, tk: z(o, "tk"), gv: z(o, "gv"), sa, ga: z(o, "ga"), sv: sa - z(o, "ga"), svp: sa ? (sa - z(o, "ga")) / sa : null,
    };
  }).filter((r) => teamOk(r.team));

  const sk = [nameCol, teamCol, numCol("g", "G", "Goals"), numCol("a", "A", "Assists"), numCol("p", "P", "Points"),
    numCol("sog", "SOG", "Shots on goal"), numCol("att", "ATT", "Shot attempts: on goal + missed (not blocked)"), numCol("hits", "HIT", "Hits"), numCol("blk", "BLK", "Blocked shots"),
    numCol("pim", "PIM", "Penalty minutes"), numCol("fow", "FOW", "Faceoffs won"), numCol("fol", "FOL", "Faceoffs lost"),
    { k: "fo", label: "FO%", title: "Faceoff win %", num: true, val: (r) => r.fo, fmt: (r) => pctCell(r.fo) },
    numCol("tk", "TK", "Takeaways"), numCol("gv", "GV", "Giveaways"), posCol];
  const gl = [nameCol, teamCol, numCol("sa", "SA", "Shots against"), numCol("sv", "SV", "Saves"), numCol("ga", "GA", "Goals against"),
    { k: "svp", label: "SV%", title: "Save %", num: true, val: (r) => r.svp, fmt: (r) => (r.svp == null ? "—" : pct3(r.svp)) }];

  const tabs = [...periods.map((n) => [n, periodLabel(pdOf(n))]), ["all", "Game"]];
  const note = `${period === "all" ? "Whole game" : `${periodLabel(pdOf(period))} only`}.${isLive(S.pbp.gameState) ? ` Updates every ${LIVE_REFRESH_MS / 1000} seconds.` : ""} Ice time and plus/minus aren't in the live feed; they show under Last game once a game is final.`;
  return `<section class="panel">
    <div class="ptabs" role="tablist" aria-label="Period">${tabs.map(([v, l]) => `<button role="tab" data-boxperiod="${v}" aria-selected="${v === period}">${l}</button>`).join("")}</div>
    <p class="sub">${note}</p>
    <h2>Skaters</h2>${sortedTable("liveSk", sk, rows.filter((r) => r.pos !== "G"), { k: "p", dir: "desc" })}
    <h2 style="margin-top:16px">Goalies</h2>${sortedTable("liveG", gl, rows.filter((r) => r.pos === "G"), { k: "sa", dir: "desc" })}
  </section>`;
}

function lastBox() {
  const M = S.matchup;
  if (!M) return `<p class="note">Loading last game…</p>`;
  const lg = M.lastGame, box = M.lastBox;
  if (!lg) return `<section class="panel"><p class="empty">No earlier games this season.</p></section>`;
  if (!box) return `<section class="panel"><p class="empty">Couldn't load the last game's boxscore.</p></section>`;
  const sk = [], gl = [];
  for (const side of ["awayTeam", "homeTeam"]) {
    const team = box[side]?.abbrev, st = box.playerByGameStats?.[side] ?? {};
    if (!teamOk(team)) continue;
    const base = (p) => ({ ...p, name: p.name?.default ?? "", num: p.sweaterNumber, pos: p.position, team });
    [...(st.forwards ?? []), ...(st.defense ?? [])].forEach((p) => sk.push(base(p)));
    (st.goalies ?? []).forEach((p) => gl.push(base(p)));
  }
  const skCols = [nameCol, teamCol, numCol("goals", "G", "Goals"), numCol("assists", "A", "Assists"),
    { k: "points", label: "P", title: "Points", num: true, val: (r) => r.points ?? (r.goals ?? 0) + (r.assists ?? 0) },
    { k: "plusMinus", label: "+/-", title: "Plus/minus", num: true, val: (r) => r.plusMinus, fmt: (r) => plusMinus(r.plusMinus) },
    numCol("sog", "SOG", "Shots on goal"), numCol("hits", "HIT", "Hits"), numCol("blockedShots", "BLK", "Blocked shots"),
    numCol("pim", "PIM", "Penalty minutes"), numCol("powerPlayGoals", "PPG", "Power-play goals"),
    { k: "fo", label: "FO%", title: "Faceoff win % (blank if none taken)", num: true, val: (r) => r.faceoffWinningPctg || null, fmt: (r) => (r.faceoffWinningPctg ? pctCell(r.faceoffWinningPctg) : "—") },
    { k: "toi", label: "TOI", title: "Time on ice", num: true, val: (r) => secs(r.toi), fmt: (r) => esc(r.toi ?? "") },
    numCol("shifts", "SHF", "Shifts"), numCol("takeaways", "TK", "Takeaways"), numCol("giveaways", "GV", "Giveaways"), posCol];
  const glCols = [nameCol, teamCol, { k: "decision", label: "Dec", title: "Decision", val: (r) => r.decision },
    numCol("shotsAgainst", "SA", "Shots against"), numCol("saves", "SV", "Saves"), numCol("goalsAgainst", "GA", "Goals against"),
    { k: "savePctg", label: "SV%", title: "Save %", num: true, val: (r) => r.savePctg, fmt: (r) => pct3(r.savePctg) },
    { k: "toi", label: "TOI", title: "Time on ice", num: true, val: (r) => secs(r.toi), fmt: (r) => esc(r.toi ?? "") }];
  return `<section class="panel">
    <h2>${esc(resultText(lg))} ${atHome(lg) ? "vs" : "at"} ${esc(oppOf(lg).abbrev)}, ${shortDate(lg.startTimeUTC)}</h2>
    <p class="sub">Tap a column to rank by it; tap again to flip the order.</p>
    <h3>Skaters</h3>${sortedTable("lastSk", skCols, sk, { k: "points", dir: "desc" })}
    <h3>Goalies</h3>${sortedTable("lastG", glCols, gl, { k: "toi", dir: "desc" })}
  </section>`;
}

/* ---------- Misc (player info) view ---------- */
const ageOf = (iso) => { const b = new Date(`${iso}T00:00:00`), n = new Date(); return n.getFullYear() - b.getFullYear() - (n < new Date(n.getFullYear(), b.getMonth(), b.getDate()) ? 1 : 0); };
const ordinal = (n) => `${n}${[11, 12, 13].includes(n % 100) ? "th" : ["th", "st", "nd", "rd"][n % 10] ?? "th"}`;
const heightOf = (inches) => (inches ? `${Math.floor(inches / 12)}'${inches % 12}"` : "");

function renderMisc() {
  const B = S.bios;
  if (B?.error) return `<p class="note error">${esc(B.error)}</p>`;
  if (!B?.list) return `<p class="note">Loading player info…</p>`;
  const rows = B.list.filter((p) => teamOk(p.team)).map((p) => {
    const b = p.bio ?? {}, d = b.draftDetails;
    return {
      name: `${b.firstName?.default ?? ""} ${b.lastName?.default ?? ""}`.trim() || "Unknown", num: p.num ?? b.sweaterNumber, pos: p.pos ?? b.position, team: p.team,
      age: b.birthDate ? ageOf(b.birthDate) : null, born: b.birthDate ?? "",
      birthplace: [b.birthCity?.default, b.birthStateProvince?.default, b.birthCountry].filter(Boolean).join(", "), country: b.birthCountry ?? "",
      draftTeam: d?.teamAbbrev ?? null, draftYear: d?.year ?? null, round: d?.round, pick: d?.pickInRound, overall: d?.overallPick ?? null,
      height: b.heightInInches ?? null, weight: b.weightInPounds ?? null, hand: b.shootsCatches ?? "",
    };
  });
  const cols = [nameCol, teamCol, posCol,
    { k: "age", label: "Age", num: true, val: (r) => r.age },
    { k: "birthplace", label: "Birthplace", val: (r) => r.birthplace },
    { k: "country", label: "Ctry", title: "Birth country", val: (r) => r.country },
    { k: "draftTeam", label: "Drafted by", val: (r) => r.draftTeam, fmt: (r) => (r.draftTeam ? teamChip(r.draftTeam) : `<span class="tm">Undrafted</span>`) },
    { k: "draftYear", label: "Year", title: "Draft year", num: true, val: (r) => r.draftYear },
    { k: "overall", label: "Pick", title: "Round, pick in round, and overall pick", num: true, val: (r) => r.overall, fmt: (r) => (r.overall ? `Rd ${r.round}, #${r.pick} <span class="tm">(${ordinal(r.overall)} overall)</span>` : "") },
    { k: "height", label: "Ht", num: true, val: (r) => r.height, fmt: (r) => esc(heightOf(r.height)) },
    { k: "weight", label: "Wt", num: true, val: (r) => r.weight },
    { k: "hand", label: "S/C", title: "Shoots/catches", val: (r) => r.hand }];
  const missing = B.list.filter((p) => !p.bio).length;
  return `<div class="stack"><div class="toolbar"><span></span>${teamSeg(oppOf(S.game).abbrev)}</div>
    <section class="panel"><h2>Player info</h2>
    <p class="sub">${B.source === "lineup" ? "Players dressed for this game." : "Current rosters; the game-night lineup isn't posted yet."} Tap a column to rank by it.${missing ? ` ${missing} player${missing > 1 ? "s" : ""} couldn't be loaded.` : ""}</p>
    ${sortedTable("misc", cols, rows, { k: "overall", dir: "asc" })}</section></div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]"); if (v) { S.view = v.dataset.view; render(); return; }
  const p = e.target.closest("[data-period]"); if (p) { S.period = p.dataset.period === "all" ? "all" : Number(p.dataset.period); S.selected = null; render(); return; }
  const s = e.target.closest("[data-sel]"); if (s) { S.selected = S.selected === s.dataset.sel ? null : s.dataset.sel; render(); return; }
  const bg = e.target.closest("[data-boxgame]"); if (bg) { S.boxGame = bg.dataset.boxgame; render(); return; }
  const bp = e.target.closest("[data-boxperiod]"); if (bp) { S.boxPeriod = bp.dataset.boxperiod === "all" ? "all" : Number(bp.dataset.boxperiod); render(); return; }
  const tf = e.target.closest("[data-team]"); if (tf) { S.teamFilter = tf.dataset.team; render(); return; }
  const so = e.target.closest("[data-sort]");
  if (so) {
    const [id, k] = so.dataset.sort.split(":"), cur = S.sorts[id];
    S.sorts[id] = cur?.k === k ? { k, dir: cur.dir === "asc" ? "desc" : "asc" } : { k, dir: so.dataset.dir };
    render();
  }
});
$("#gamepick").addEventListener("change", (e) => selectGame(Number(e.target.value)));

init();
</script>
</body>
</html>
